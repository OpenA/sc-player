<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>SC player example: Modern Skin</title>
		<link rel="stylesheet" href="styles/sc-player-modern.css" type="text/css">
		<script type="text/javascript" src="../js/sc-player.js"></script>
		<script type="text/javascript" src="../js/maFF/metadata-parser.js"></script>
		<script type="text/javascript" src="../js/maFF/midora.js"></script>
		<script type="text/javascript" src="../js/sc-module-integration.js"></script>
		<link rel="stylesheet" type="text/css" href="../css/sc-player-modern/sc-player-modern.css">
		<link rel="stylesheet" type="text/css" href="../css/sc-player-modern/sc-player-oldband.css">
	</head>
	<body>
		<a class="standart-player" href="sc-player-standard.html">Standart Player</a>
		<h1>Modern Player</h1>
		<div id="fx-horiz">
			<div class="fx-cell o-styles">
				<ul>
					<li class="P-horizontal"></li>
					<li class="P-vertical"></li>
					<li class="S-oldband"></li>
				</ul>
			</div>
			<div class="fx-cell"></div>
		</div>
		<script type="text/javascript">
			const cv = location.hash.substring(1);
			const fx = document.getElementById('fx-horiz');

			let th = cv.endsWith  ('band') ? 'oldband'  : 'modern'
			let vp = cv.startsWith('vert') ? 'vertical' : 'horizontal';

			const sc = new SCPlayer({ theme: th, variant: vp });
			const li = fx.querySelectorAll(`li.P-${vp}, li.S-${th}`);

			li[li.length - 1].classList.add('selected');
			fx.children[1].append(sc);
			fx.children[0].onclick = ({ target: el }) => {
				let [opt = '', sel = ''] = el.classList;
				if (opt.startsWith('S') && sel !== 'selected') {
					sc.className = `sc-player-${opt = opt.substring(2)}`;
				} else
				if (opt.startsWith('P') && sel !== 'selected') {
					sc.className = `sc-player-modern sc-P-${opt = opt.substring(2)}`;
				} else
					return;
				for (const ch of el.parentNode.children) {
					ch.classList.remove('selected');
				}
				el.classList.add('selected');
				location.hash = opt;
			};
		</script>
		<div class="footer">
			<h2>minimalistic skin for the dynamic insertion</h2>
			<a href="https://github.com/OpenA/sc-player">GitHub</a>
		</div>
	</body>
 </html>
